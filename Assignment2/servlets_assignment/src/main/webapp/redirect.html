<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Redirect</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #4285F4, #34A853);
            margin: 0;
        }

        .redirect-container {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4285F4;
            box-shadow: 0 0 8px rgba(66, 133, 244, 0.4);
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #4285F4;
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #3367D6;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h2>Google Redirect</h2>
        <form id="googleForm">
            <input type="text" id="keyword" name="keyword" placeholder="Enter keyword" required>
            <input type="submit" value="Search">
        </form>
    </div>

    <script>
        // Correctly redirect to Google and handle spaces in the keyword
        document.getElementById('googleForm').addEventListener('submit', function(e) {
            e.preventDefault(); // prevent form from submitting to non-existent page
            const keyword = encodeURIComponent(document.getElementById('keyword').value.trim());
            if(keyword) {
                window.location.href = `https://www.google.com/search?q=${keyword}`;
            }
        });
    </script>
</body>
</html>
